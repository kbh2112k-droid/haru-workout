<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>하루운동 · 나의 운동 기록</title>
<meta name="description" content="매일의 운동을 기록하고 오늘의 운동 시간을 확인하세요.">
<link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./style.css"><script src="./app.js" defer></script>
</head>
<body>
<header class="topbar"><a class="brand" href="./index.html"><span class="brand-icon">ϟ</span>하루운동</a><span class="header-label">나의 운동 기록</span></header>
<main class="shell">
<section class="page-heading"><div><p class="eyebrow">MY DAILY MOVEMENT</p><h1>오늘도, 나를 위한 움직임</h1><p class="intro">작은 움직임도 소중한 기록이 돼요.</p></div><span class="date-badge" id="today-date"></span></section>
<div class="workspace">
<section class="record-panel"><div class="section-heading"><h2>운동 기록하기</h2><span class="step-label">매일 차곡차곡</span></div>
<form id="workout-form"><fieldset><legend>어떤 운동을 했나요?</legend><div class="exercise-options" id="kinds"></div></fieldset>
<div class="field-row"><label class="field">운동한 날짜<div class="input-wrap"><input id="date" type="date" required></div></label><label class="field">운동 시간<div class="input-wrap"><input id="minutes" type="number" inputmode="numeric" min="1" max="1440" step="1" value="30" required><span>분</span></div></label></div>
<div class="quick-times"><span>시간 간편 선택</span><button type="button" data-minutes="10">10분</button><button type="button" data-minutes="30" class="active">30분</button><button type="button" data-minutes="60">60분</button></div>
<button class="save-button" type="submit">＋ 운동 기록 저장하기</button><p class="save-note">✓ 기록은 이 브라우저에 저장돼요.</p><p id="status" role="status" aria-live="polite"></p></form></section>
<section class="today-panel" aria-label="오늘의 운동 요약"><div class="section-heading"><h2>오늘의 움직임</h2><span class="today-tag">TODAY</span></div><div class="total-time"><span>총 운동 시간</span><div><strong id="total">0</strong><span>분</span></div><p id="summary"></p></div><div class="today-breakdown" id="breakdown"></div><div class="today-foot">ϟ 내 속도로, 꾸준히 함께해요.</div></section>
</div>
<section class="history"><div class="section-heading"><div class="history-title"><h2>나의 운동 기록</h2><span class="count" id="count">0</span></div><span class="muted">최근 날짜순</span></div><div id="history"></div></section>
<footer>하루운동 <span>·</span> 나를 돌보는 작은 습관</footer></main>
</body></html>
